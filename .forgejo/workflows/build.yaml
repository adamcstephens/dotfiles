on:
  push:

env:
  ATTIC_URL: ${{ vars.ATTIC_URL }}
  ATTIC_CACHE: ${{ vars.ATTIC_CACHE }}
  ATTIC_KEY: ${{ secrets.ATTIC_KEY }}
  SOWER_ENDPOINT: ${{ vars.SOWER_ENDPOINT }}
  SOWER_API_TOKEN: ${{ secrets.SOWER_API_TOKEN }}

jobs:
  build-and-seed-x86_64:
    runs-on: local/x86_64-linux

    steps:
      - uses: actions/checkout@v4

      - run: |
          export HOME=$PWD
          nix develop .#ci --command seed-ci --attic-upload=true --nom=false --sower-seed=true --system x86_64-linux --cache-build-deps=true
