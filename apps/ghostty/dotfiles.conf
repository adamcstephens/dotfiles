working-directory = home
window-inherit-working-directory = false

shell-integration = none

window-padding-x = 5
window-padding-y = 5

copy-on-select = clipboard

keybind = ctrl+shift+delete=reset

keybind = alt+shift+h=goto_split:left
keybind = alt+shift+l=goto_split:right
keybind = alt+shift+k=goto_split:top
keybind = alt+shift+j=goto_split:bottom

keybind = ctrl+tab=unbind
keybind = ctrl+shift+tab=unbind

keybind = super+shift+left_bracket=previous_tab
keybind = super+shift+right_bracket=previous_tab
