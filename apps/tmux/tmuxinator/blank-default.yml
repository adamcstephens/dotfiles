name: default
root: ~/

windows:
  - general:
      layout: main-vertical
      panes:
        - senpai
        - cd ~/projects/sower; nix run .#

  - stop:
      root: ~/projects/stop
      layout: even-horizontal
      panes:
        - vim .
        -

  - dotfiles:
      root: ~/.dotfiles
      layout: even-horizontal
      panes:
        - vim .
        -

  - sower:
      root: ~/projects/sower
      layout: "2833,339x80,0,0{169x80,0,0,3,169x80,170,0[169x40,170,0,8,169x39,170,41,17]}"
      panes:
        - vim .
        -
        -

  - nixpkgs:
      root: ~/git/nixpkgs
      layout: even-horizontal
      panes:
        - vim .
        -
