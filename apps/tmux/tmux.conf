if-shell -b '[ "$TERM" = "xterm-ghostty" ]' {
  set -g default-terminal "xterm-ghostty"
}
if-shell -b '[ "$TERM" = "xterm-kitty" ]' {
  set -g default-terminal "xterm-kitty"
}

set -a terminal-features '*:RGB' # truecolor
set -g @copy_use_osc52_fallback on

set-option -g allow-passthrough all
set -g xterm-keys on
set -s extended-keys on
set -g extended-keys-format csi-u
set -as terminal-features 'xterm*:extkeys'

set -g mouse off
set -g status-keys vi
set -g mode-keys   vi
set -g clock-mode-style 24
set -g history-limit 12000

set-option -g set-titles on
set-option -g set-titles-string "[#h] tmux"

# Start index of window/pane with 1, because we're humans, not computers
set -g base-index 1
setw -g pane-base-index 1

set-option -g mouse on

unbind-key -n C-Space

# increase the history
set-option -g history-limit 500000

# open splits in cwd
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind-key -T root M-n split-window -v -c "#{pane_current_path}"

# don't delay on escape key
set -s escape-time 0

# focus events enabled for terminals that support them
set -g focus-events on

set -g set-clipboard on
set -g word-separators " |{}()[]<>`='\"!@#$%^&*:;,?"

# trigger copy mode by
tui_app="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?(senpai)$'"
bind -n M-Up if-shell "$tui_app" "send-keys M-Up" copy-mode

# launch custom popups
bind -n M-p display-popup -E -w 40% -h 40% -d "#{pane_current_path}" "prj"
bind -n M-g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "TMUX_PANE='' vcs-tui"
bind -n M-f display-popup -E -w 80% -h 60% "tmux-jump"

# open a new tab in home
bind-key -n M-t new-window -c ~

# toggle synchronize panes
bind X set-window-option synchronize-panes\; display-message "synchronize-panes is now #{?pane_synchronized,on,off}"

# Scroll up/down by 1 line, half screen, whole screen
bind -T copy-mode-vi M-Up              send-keys -X scroll-up
bind -T copy-mode-vi M-Down            send-keys -X scroll-down
bind -T copy-mode-vi M-PageUp          send-keys -X halfpage-up
bind -T copy-mode-vi M-PageDown        send-keys -X halfpage-down
bind -T copy-mode-vi PageDown          send-keys -X page-down
bind -T copy-mode-vi PageUp            send-keys -X page-up

# When scrolling with mouse wheel, reduce number of scrolled rows per tick to "2" (default is 5)
bind -T copy-mode-vi WheelUpPane       select-pane \; send-keys -X -N 2 scroll-up
bind -T copy-mode-vi WheelDownPane     select-pane \; send-keys -X -N 2 scroll-down

# smart-splits
set -g @smart-splits_no_wrap '' # to disable wrapping. (any value disables wrapping)

set -g @smart-splits_move_left_key  'M-h'
set -g @smart-splits_move_down_key  'M-j'
set -g @smart-splits_move_up_key    'M-k'
set -g @smart-splits_move_right_key 'M-l'

set -g @smart-splits_resize_left_key  'S-Left'
set -g @smart-splits_resize_down_key  'S-Down'
set -g @smart-splits_resize_up_key    'S-Up'
set -g @smart-splits_resize_right_key 'S-right'

set -g @smart-splits_resize_step_size '3'
set -g @smart-splits_no_wrap 'true'

run-shell ~/.config/tmux/smart-splits.tmux
run-shell ~/.config/tmux/tmux-click-copy/tmux-click-copy.tmux

# zoom toggle
bind -n M-z resize-pane -Z

# tabs (windows)
bind -n C-Tab select-window -n
bind -n C-BTab select-window -p
bind -n M-Tab select-window -n
bind -n M-BTab select-window -p

bind-key -n C-S-Left swap-window -t -1\; select-window -t -1
bind-key -n C-S-Right swap-window -t +1\; select-window -t +1

set -g status on
set -g status-interval 2
set -g status-justify centre
set -g status-position bottom
set -g status-left " #(hostname)"
set -g status-right "%T %F "

# silence bells
set-option -g visual-activity off
set-option -g visual-bell off
set-option -g visual-silence off
set-window-option -g monitor-activity off
set-option -g bell-action none

# use hooks to avoid having a border with a single pane
set-hook -g after-split-window  "run-shell 'if [ $(tmux list-panes | wc -l) -gt 1 ]; then tmux set pane-border-status top; fi'"
set-hook -g pane-exited         "run-shell 'if [ $(tmux list-panes | wc -l) -gt 1 ]; then tmux set pane-border-status top; else tmux set pane-border-status off; fi'"
set-hook -g window-pane-changed "run-shell 'if [ $(tmux list-panes | wc -l) -gt 1 ]; then tmux set pane-border-status top; else tmux set pane-border-status off; fi'"

set -g pane-border-format ' #{?pane_active,𑁱 , }#{pane_title} '

# start with border off
set -g pane-border-status off

run-shell "dark sync-tmux"
set-hook -g client-attached "run-shell 'dark sync-tmux'"
run-shell -b "dark watch-tmux"
